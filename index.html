<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1a33" />
    <meta name="description" content="A youth soccer career RPG: train, play, and draw your reads in slow motion." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SoccerMaster" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>SoccerMaster RPG</title>
    <link rel="stylesheet" href="/src/ui/theme.css" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>SoccerMaster RPG needs JavaScript to run.</noscript>
    <script>
      // Boot watchdog: if the app module never runs (stale offline shell, failed asset, blocked
      // script) the page would stay blank forever. Offer a retry that drops the offline cache.
      (function () {
        var BOOT_MS = 8000;
        setTimeout(function () {
          if (document.documentElement.classList.contains("booted")) return;
          var app = document.getElementById("app");
          if (!app || app.childElementCount > 0) return;
          app.innerHTML =
            '<section class="screen recovery"><div class="card"><h1>Still loading\u2026</h1>' +
            '<p>The game did not start. Your saved campaign is safe.</p>' +
            '<div class="actions"><button class="primary" id="boot-retry" type="button">Retry</button></div></div></section>';
          document.getElementById("boot-retry").addEventListener("click", function () {
            var done = function () { location.reload(); };
            var work = [];
            if ("serviceWorker" in navigator) {
              work.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              }));
            }
            if ("caches" in window) {
              work.push(caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              }));
            }
            Promise.all(work).then(done, done);
          });
        }, BOOT_MS);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
